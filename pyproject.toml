# SPDX-License-Identifier: AGPL-3.0-only
[project]
name = "shruti-astro"
version = "0.1.0"
description = "Astrological computation daemon for shrutivtuber.com — Hellenistic and Vedic"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }

dependencies = [
    "fastapi >=0.115,<1.0",
    "uvicorn[standard] >=0.32,<1.0",
    # Swiss Ephemeris. Used under the AGPL arm of its dual licence — which is
    # why this whole daemon is AGPL and public. See README.
    "pyswisseph >=2.10,<3.0",
    "pydantic >=2.10,<3.0",
    "pydantic-settings >=2.7,<3.0",
    "timezonefinder >=6.5,<7.0",
]

[project.optional-dependencies]
dev = ["pytest >=8.3,<9.0", "httpx >=0.28,<1.0", "ruff >=0.8,<1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shruti_astro"]

[tool.ruff]
line-length = 100
target-version = "py312"
